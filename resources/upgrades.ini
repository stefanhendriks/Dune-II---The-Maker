; Upgrades: a structure upgrade that makes a new unit or structure available in a build list.
; Every section is an upgrade, named like the UPGRADE_TYPE_ constant without that prefix: [HEAVYFCTRY_MVC].
; Other names are skipped. An upgrade without a section is disabled. Keys that are absent use the default.
; The structure and unit rules (structures.ini, units.ini) are read first, costs can refer to them.
;
; Enabled=true (default) or false to switch the upgrade off
; Description=name shown in the game
; Icon=name of the icon in the interface graphics
; Houses=comma separated houses that get this upgrade (Atreides, Ordos, Harkonnen, Sardaukar, Fremen)
; TechLevel=minimum tech level (campaign mission) needed
; Structure=structure that is upgraded (the names of structures.ini, for example HEAVYFACTORY)
; NeedsStructure=structure that must also be available (no key = none)
; AtUpgradeLevel=the upgrade level of the structure at which this upgrade is offered (0 = first)
; DependsOnStructureLevel=true (default) follows the shared upgrade level of the structure, false tracks it per upgrade
; Cost=price, or CostOfStructure=STRUCTURE / CostOfUnit=UNIT for a percentage (CostPercentage, default 50) of its cost
; ProvidesType=STRUCTURE or UNIT, Provides=name of what becomes available (names of structures.ini / units.ini)
; List=build list it appears in (CONSTYARD, FOOT_UNITS or UNITS), SubList=CONSTYARD, LIGHTFCTRY, HEAVYFCTRY, HIGHTECH, INFANTRY or TROOPERS
; BuildTime=time it takes to upgrade, BuildTimeCheatMode=the same while cheat mode is on (default: BuildTime)

