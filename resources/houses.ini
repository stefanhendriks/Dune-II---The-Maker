; Dune II - The Maker: houses
; DEVELOPER PROFILE (the shipped file is houses.ini.org).
;
; Each house is defined in its own section, named after the house: [ATREIDES].
; House names must be in capitals, otherwise the house is not recognized.
;
; MINIMAPCOLOR sets the colour shown on the minimap (r,g,b).
; TEAMCOLOR_0 through TEAMCOLOR_6 define the sprite recolor shades, from brightest (0) to darkest (6).
; MoveSpeedFactor, BuildSpeedFactor, HarvestSpeedFactor, DumpSpeedFactor and InflictDamageFactor
; are the house difficulty factors. Keys that are absent use the original values.
;
; ";", "#" or "//" starts a comment. It cannot be used AFTER a line.

