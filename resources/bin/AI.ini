; AI tuning values. Every key is optional: when absent the value below is used.
; Brain timers count brain ticks (100 ms, so 10 is 1 second). Chances are percentages.
; A random amount is <Name>Base + a random value from 0 to <Name>Random - 1.

[SHARED]
; ticks to rest between two think cycles
RestTime=10
; ticks to rest when the "no AI rest" setting is on
RestTimeWhenNoAiRest=10
; an enemy unit discovered within this distance (in cells) of the base center triggers a response
BaseDefenseRadius=20
; a damaged or decaying structure is repaired only when the player has these credits
RepairStructureMinCredits=50
; ... and its hit points are below this fraction of its max hit points
RepairStructureBelowHpFraction=0.75
; max number of units sent to respond to a threat
RespondersWhenHarvesterAttackedBase=2
RespondersWhenHarvesterAttackedRandom=4
RespondersWhenStructureAttackedBase=2
RespondersWhenStructureAttackedRandom=4
RespondersWhenEnemyNearBaseBase=2
RespondersWhenEnemyNearBaseRandom=4
; initial delay of a superweapon mission (deathhand, saboteur, fremen) is RNG::rnd(this)
SuperWeaponMissionDelayRandom=10

[SKIRMISH]
; personality, rolled once when the brain is created
; initial rest is RNG::rnd(this) ticks
InitialRestRandom=25
; consider an additional refinery after this many ticks (30 seconds), times the multiplier below
ConsiderAdditionalRefineryAfter=300
ConsiderAdditionalRefineryMultiplierBase=1
ConsiderAdditionalRefineryMultiplierRandom=3
; may build additional units after this many ticks (3 minutes), plus the offset below
MayBuildAdditionalUnitsAfter=1800
MayBuildAdditionalUnitsOffsetBase=-400
MayBuildAdditionalUnitsOffsetRandom=800
EagernessToBuildRandomUnits=15
IdealRefineriesBase=2
IdealRefineriesRandom=2
; ideal harvesters = ideal refineries * harvestersPerRefinery + RNG::rnd(idealHarvestersRandomExtra)
HarvestersPerRefinery=2
IdealHarvestersRandomExtra=2
IdealCarryallsBase=2
IdealCarryallsRandom=2
IdealOrnithoptersBase=0
IdealOrnithoptersRandom=5
InitialEconomyScore=50
; economy
; the economy score is credits / idealCredits as a percentage (capped at 100)
IdealCredits=1500
; the economy score moves towards its target by (distance / this) per evaluation
EconomyScoreStepDivisor=5
; economy state thresholds on the economy score
EconomyBadBelow=15
EconomyImproveBelow=30
EconomyGoodAbove=70
; start a unit upgrade only with these credits (and a normal or good economy)
UnitUpgradeMinCredits=500
; units built without a mission (after mayBuildAdditionalUnitsAfter)
; with a bad economy, keep at least this many harvesters and carryalls
BadEconomyMinHarvesters=2
BadEconomyMinCarryalls=1
; chance per unit kind = eagernessToBuildRandomUnits + this bonus
AdditionalUnitsChanceBonusGoodEconomy=15
AdditionalUnitsChanceBonusOtherEconomy=5
; cooldown is increased by RNG::rnd(this) ticks per attempt
AdditionalUnitsCooldownRandom=15
AdditionalUnitsMaxSiegeTanks=8
AdditionalUnitsMaxLaunchers=6
AdditionalUnitsMaxQuads=5
AdditionalUnitsMaxTanks=4
; missions
; initial delay of a (non superweapon) mission is RNG::rnd(this)
MissionDelayRandom=15
HarvestersPerEconomyMission=1
CarryallsPerEconomyMission=1
ScoutsPerScoutMission=1
GuardForceQuads=1
GuardForceTanks=2
AirAttackOrnithoptersBase=1
AirAttackOrnithoptersRandom=3
; ground attack mission composition
GroundAttackSmallChance=15
GroundAttackNormalChance=50
GroundAttackBigChance=75
; chances are multiplied when the player has more than these credits
GroundAttackRichCredits=2500
GroundAttackRichChanceMultiplier=1.5
GroundAttackWealthyCredits=1500
GroundAttackWealthyChanceMultiplier=1.25
GroundAttackSiegeTanksBase=1
GroundAttackSiegeTanksRandom=4
GroundAttackTroopersBase=1
GroundAttackTroopersRandom=2
GroundAttackInfantryBase=1
GroundAttackInfantryRandom=2
GroundAttackLaunchersBase=1
GroundAttackLaunchersRandom=3
GroundAttackTanksBase=1
GroundAttackTanksRandom=4
GroundAttackScoutsBase=1
GroundAttackScoutsRandom=2
GroundAttackQuadsBase=1
GroundAttackQuadsRandom=3
GroundAttackSpecialUnitsBase=1
GroundAttackSpecialUnitsRandom=2
; structure to build next
; with an improving or bad economy, build refineries up to this count first
LowEconomyRefineries=2
AdditionalRefineryChance=50
SiloWhenStorageAlmostFullChance=15
; chance to pick the radar before the heavy factory
RadarBeforeHeavyFactoryChance=50
EarlyInfantryStructureChance=15
EarlyPalaceChance=5
EarlyTurretChance=35
EarlyTurretsMax=2
EarlyHighTechChance=40
; chance = base - (count already built * penalty)
RocketTurretBaseChance=60
RocketTurretChancePenaltyPerTurret=10
TurretBaseChance=40
TurretChancePenaltyPerTurret=5
; chance to build a palace, tried at three points late in the build order
LatePalaceChance=15
RocketTurretsMax=8
AdditionalHeavyFactoryChance=30
; max heavy factories, light factories, WORs and barracks with a normal economy
ProductionStructuresMax=2
; end game (no construction yard left)
; chance to attack a unit instead of a structure
EndGameAttackUnitChance=50
; chance to stop at the current candidate while looking for a target
EndGamePickUnitChance=5
EndGamePickStructureChance=10
; a unit in the way of a new structure moves to a random cell within this distance
MoveAsideDistance=3

[CAMPAIGN]
; ticks to rest before the first think cycle (4 minutes)
InitialRestTime=2400
; initial delay of the scout mission is RNG::rnd(this)
ScoutMissionDelayRandom=5
ScoutsPerScoutMission=1

[MISSIONS]
; waiting for a build order (cPlayerBrainMission)
; ticks to wait when the build time is unknown; a wait at or below this is replaced by the fallback below
BuildOrderDefaultWaitTicks=15
; wait this factor times the item's build time before giving up
BuildOrderWaitBuildTimeFactor=1.25
BuildOrderFallbackWaitMs=300000
; extra wait on top, so the brain has time to process the build order
BuildOrderExtraWaitMs=60000
; a mission without units waits this long again after gathering resources
MissionWithoutUnitsWaitMs=600000
; attack
; chance to look for a unit target first (else a structure)
AttackTargetUnitFirstChance=50
; chance to stop at the current candidate while looking for a target
AttackPickStructureChance=10
AttackPickUnitChance=5
; deathhand
DeathHandPickStructureChance=25
DeathHandPickUnitChance=5
; saboteur
SaboteurPickStructureChance=25
; explore
; explore targets keep this distance (in cells) from the map border
ExploreBorderDistance=2
; a new target is picked when an idle unit is within this distance of the target
ExploreArrivedDistanceIdle=4
; ... or a moving unit is within this distance
ExploreArrivedDistanceMoving=2

[SANDWORM]
; the sandworms are moved every this many brain ticks
ThinkInterval=5

[FREMEN_SUPERWEAPON]
; an enemy player is skipped when the roll is above this
SkipPlayerAbove=70
; the current unit / structure target is kept when the roll is above this
KeepUnitTargetAbove=30
KeepStructureTargetAbove=30
