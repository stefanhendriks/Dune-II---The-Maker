name: Claude Code Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

# One in-flight review per PR per trigger kind; a newer push cancels the older
# run instead of stacking. The event kind is part of the key so that the
# progress comment posted by track_progress (an issue_comment event) does not
# land in the same group as the pull_request review and cancel it.
concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Run automatically when a PR is opened / reopened / marked ready (drafts are
    # skipped), OR when someone comments "@claude" on a PR/issue. Re-review after
    # a push is opt-in via an "@claude" comment, to stay within the rate limit.
    if: >
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Maintain a progress comment on the PR and wire up the GitHub
          # comment tools so the review is reliably posted back.
          track_progress: true
          # Temporary while validating the workflow; remove once reviews land.
          show_full_output: true
          # Only used for the automatic pull_request trigger; ignored when
          # someone explicitly invokes @claude with their own instructions.
          prompt: |
            Before reviewing, read and follow the guidelines in .claude/review.md
            at the root of this repository — treat it as the primary review
            checklist. Also respect any conventions defined in CLAUDE.md and
            elsewhere under .claude/ (coding standards, allowed patterns, etc.);
            those take precedence over your own defaults if they conflict.

            Then review this pull request to the Dune II - The Maker (D2TM)
            codebase, a C++ real-time strategy game engine (a Dune II remake).

            If review.md doesn't cover something, fall back to general good
            judgment on:
            - Memory safety and resource management (raw pointers, ownership, leaks)
            - Correctness of game logic changes (units, structures, AI, pathfinding, map/terrain)
            - Performance implications for the game loop / rendering / update code
            - Consistency with existing code style and structures in this codebase
            - Any changes that could break the build or existing CI

            Post one summary comment following the "Review output format"
            section of .claude/review.md: a one-line verdict plus a list of
            issues found, nothing else. Do not narrate your process or recap
            what you checked. Leave inline comments only for concrete defects on
            specific lines. Be direct about problems, but don't nitpick pure
            style preferences that don't affect correctness or readability.
          claude_args: |
            --max-turns 45
            --allowedTools "Bash(git diff:*),Bash(git fetch:*),Bash(git log:*)"
