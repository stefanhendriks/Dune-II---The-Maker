name: Build and publish release

on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
        description: "Official: the release tag (must exist). Dev build: tag, branch, or commit SHA."
      official:
        description: "Official release: <tag> named, marked latest, changelog generated to the wiki, milestone closed. Off = throwaway manual- build."
        required: false
        type: boolean
        default: false
      previous_tag:
        description: "Previous release tag to diff the changelog against (e.g. v0.8.0). Required when official is checked."
        required: false
        type: string

concurrency:
  group: master-builds
  cancel-in-progress: false   # wait until the current run finishes

jobs:
  Prepare:
    name: Create release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Resolve release identity
        id: resolve
        run: |
          INPUT="${{ inputs.tag }}"
          # --target must be a branch or commit SHA; a tag name is rejected.
          # The checkout above resolved inputs.tag, so use the checked-out commit.
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

          if [[ "${{ inputs.official }}" == "true" ]]; then
            if [[ -z "${{ inputs.previous_tag }}" ]]; then
              echo "::error::previous_tag is required when official is checked"
              exit 1
            fi
            # Official release: keep the tag name, curated title, mark it latest.
            # The Cleanup job only prunes "manual-*", so this one is left alone.
            echo "tag=$INPUT" >> $GITHUB_OUTPUT
            echo "title=Version ${INPUT#v}" >> $GITHUB_OUTPUT
            echo "notes=Full changelog: https://github.com/${{ github.repository }}/wiki/${INPUT}" >> $GITHUB_OUTPUT
            echo "latest=true" >> $GITHUB_OUTPUT
          else
            # Throwaway dev build: "manual-" prefix so it is visibly not an
            # official release and Cleanup prunes it after 30 days. SHA input ->
            # short hash; anything else (tag/branch) -> the ref name as given.
            if [[ "$INPUT" =~ ^[0-9a-f]{40}$ ]]; then
              echo "tag=manual-${INPUT:0:7}" >> $GITHUB_OUTPUT
            else
              echo "tag=manual-$INPUT" >> $GITHUB_OUTPUT
            fi
            echo "title=Manual Build - $(date -u +'%Y-%m-%d %H:%M')" >> $GITHUB_OUTPUT
            echo "notes=Manual build from ${INPUT}" >> $GITHUB_OUTPUT
            echo "latest=false" >> $GITHUB_OUTPUT
          fi
      - name: Set up Python
        if: ${{ inputs.official }}
        uses: actions/setup-python@v3
        with:
          python-version: "3.14"
      - name: Generate changelog
        if: ${{ inputs.official }}
        id: notes
        uses: AbsaOSS/generate-release-notes@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag-name: ${{ inputs.tag }}
          from-tag-name: ${{ inputs.previous_tag }}
          chapters: |
            - {"title": "🚀 Features", "labels": "feature, improvement"}
            - {"title": "🎲 Gameplay", "labels": "balancing"}
            - {"title": "🧩️ Dune 2 features", "label": "missing-dune2-piece"}
            - {"title": "🧪 Experimental", "label": "experimental"}
            - {"title": "🐛 Fixes", "labels": "bug"}
            - {"title": "⚙️ Technical", "labels": "refactoring, technical"}
      - name: Assemble changelog file
        if: ${{ inputs.official }}
        run: |
          mkdir -p temp_release_notes
          cat << 'EOF' \
          | sed '/^## Closed Issues without Pull Request/,/^## /d' \
          | sed '/^## Merged PRs without Issue and User Defined Labels/,/^## /d' \
          | sed '/^## Closed PRs without Issue and User Defined Labels/,/^## /d' \
          | sed '/^## Merged PRs Linked to .Not Closed. Issue/,/^## /d' \
          | sed '/^## Direct Commits/,/^## /d' \
          > temp_release_notes/${{ inputs.tag }}.md
            ${{ steps.notes.outputs.release-notes }}
          EOF
      - name: Write changelog to wiki page
        if: ${{ inputs.official }}
        uses: docker://decathlon/wiki-page-creator-action:2.0.2
        env:
          GH_PAT: ${{ secrets.GH_PAT_D2TM }}
          ACTION_MAIL: stefan@fundynamic.com
          ACTION_NAME: stefanhendriks
          OWNER: stefanhendriks
          REPO_NAME: Dune-II---The-Maker
          MD_FOLDER: temp_release_notes
      - name: Create release
        run: |
          TAG="${{ steps.resolve.outputs.tag }}"
          gh release view "$TAG" > /dev/null 2>&1 || \
            gh release create "$TAG" \
              --title "${{ steps.resolve.outputs.title }}" \
              --notes "${{ steps.resolve.outputs.notes }}" \
              --latest=${{ steps.resolve.outputs.latest }} \
              --target "${{ steps.resolve.outputs.sha }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  MSYS2:
    name: Windows-msys2-mingw64
    needs: Prepare
    runs-on: [ windows-latest ]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Install MSYS2 with MinGW 64-bit
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64 # D2TM is built within a MinGW64 bit environment
          update: true
          install: git gzip zip unzip mingw-w64-x86_64-toolchain mingw-w64-x86_64-sdl3 mingw-w64-x86_64-sdl3-mixer mingw-w64-x86_64-sdl3-image mingw-w64-x86_64-sdl3-ttf mingw64/mingw-w64-x86_64-cmake mingw-w64-x86_64-catch
      - name: configure Pagefile
        uses: al-cheb/configure-pagefile-action@v1.5
        with:
          minimum-size: 16GB
          maximum-size: 16GB
          disk-root: "C:"
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          submodules: recursive
          fetch-depth: 0   # fetch full history to see all files
      - name: Configure
        run: |
          cd "${{ github.workspace }}"
          mkdir build
          cd build
          cmake .. -DENV_D2TM_VERSION=${{ needs.Prepare.outputs.tag }} -DCMAKE_BUILD_TYPE=RelWithDebInfo -G "MinGW Makefiles"
      - name: Build
        run: |
          cd "${{ github.workspace }}\build"
          cmake --build . -j2
      - name: Test
        run: |
          cd "${{ github.workspace }}\build"
          ctest --output-on-failure
      - name: Produce binary
        run: |
          cd "${{ github.workspace }}"
          ./create_release.bat
      - name: Zip binary
        run: |
          cd "${{ github.workspace }}/bin"
          zip -vr d2tm.zip . -x "*.DS_Store"
      - name: Upload Windows binary to release
        shell: bash
        run: |
          TAG="${{ needs.Prepare.outputs.tag }}"
          cp bin/d2tm.zip bin/d2tm-windows-${TAG}.zip
          gh release upload "$TAG" bin/d2tm-windows-${TAG}.zip --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  Ubuntu:
    name: Ubuntu (x86)
    needs: [Prepare, MSYS2]
    runs-on: [ ubuntu-latest ]
    steps:
      - name: Set up GCC
        uses: egor-tensin/setup-gcc@v1
        with:
          version: 14
          platform: x86
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          submodules: recursive
          fetch-depth: 0   # fetch full history to see all files
      - name: Install dependencies
        run: |
          cd "${{ github.workspace }}"
          chmod +x install_dependencies_ubuntu.sh
          ./install_dependencies_ubuntu.sh
      - name: Configure
        run: |
          cd "${{ github.workspace }}"
          mkdir build
          cd build
          cmake .. -DENV_D2TM_VERSION=${{ needs.Prepare.outputs.tag }} -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: |
          cd "${{ github.workspace }}/build"
          make -j4
      - name: Test
        run: |
          cd "${{ github.workspace }}/build"
          ctest --output-on-failure
      - name: Produce binary
        run: |
          cd "${{ github.workspace }}"
          ./create_release.sh
      - name: Zip binary
        run: |
          cd "${{ github.workspace }}/bin"
          zip -vr d2tm.zip . -x "*.DS_Store"
      - name: Upload Linux binary to release
        run: |
          TAG="${{ needs.Prepare.outputs.tag }}"
          cp bin/d2tm.zip bin/d2tm-linux-${TAG}.zip
          gh release upload "$TAG" bin/d2tm-linux-${TAG}.zip --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  MACOSX:
    name: Mac OS X (Arm64)
    needs: [Prepare, Ubuntu]
    runs-on: [ macos-15 ]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          submodules: recursive
          fetch-depth: 0   # fetch full history to see all files
      - name: Install dependencies
        run: |
          ./install_dependencies_macosx.sh
      - name: Configure
        run: |
          cd "${{ github.workspace }}"
          mkdir build
          cd build
          cmake .. -DENV_D2TM_VERSION=${{ needs.Prepare.outputs.tag }} -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: |
          cd "${{ github.workspace }}/build"
          make -j4
      - name: Test
        run: |
          cd "${{ github.workspace }}/build"
          ctest --output-on-failure
      - name: Produce binary
        run: |
          cd "${{ github.workspace }}"
          ./create_release.sh
      - name: Zip binary
        run: |
          cd "${{ github.workspace }}/bin"
          zip -vr d2tm.zip . -x "*.DS_Store"
      - name: Upload macOS ARM binary to release
        run: |
          TAG="${{ needs.Prepare.outputs.tag }}"
          cp bin/d2tm.zip bin/d2tm-macos-arm-${TAG}.zip
          gh release upload "$TAG" bin/d2tm-macos-arm-${TAG}.zip --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  MACOSX_INTEL:
    name: Mac OS X (Intel)
    needs: [Prepare, MACOSX]
    runs-on: [ macos-15-intel ]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          submodules: recursive
          fetch-depth: 0   # fetch full history to see all files
      - name: Install dependencies
        run: |
          ./install_dependencies_macosx.sh
      - name: Configure
        run: |
          cd "${{ github.workspace }}"
          mkdir build
          cd build
          cmake .. -DENV_D2TM_VERSION=${{ needs.Prepare.outputs.tag }} -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: |
          cd "${{ github.workspace }}/build"
          make -j4
      - name: Test
        run: |
          cd "${{ github.workspace }}/build"
          ctest --output-on-failure
      - name: Produce binary
        run: |
          cd "${{ github.workspace }}"
          ./create_release.sh
      - name: Zip binary
        run: |
          cd "${{ github.workspace }}/bin"
          zip -vr d2tm.zip . -x "*.DS_Store"
      - name: Upload macOS Intel binary to release
        run: |
          TAG="${{ needs.Prepare.outputs.tag }}"
          cp bin/d2tm.zip bin/d2tm-macos-intel-${TAG}.zip
          gh release upload "$TAG" bin/d2tm-macos-intel-${TAG}.zip --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  Finalize:
    name: Close milestone
    needs: [Prepare, MSYS2, Ubuntu, MACOSX, MACOSX_INTEL]
    if: ${{ inputs.official && success() }}
    runs-on: ubuntu-latest
    steps:
      - name: Close the milestone matching the tag
        run: |
          TITLE="${{ inputs.tag }}"
          NUM=$(gh api "repos/${{ github.repository }}/milestones?state=open" \
                  --jq ".[] | select(.title == \"$TITLE\") | .number")
          if [ -z "$NUM" ]; then
            echo "No open milestone titled $TITLE; nothing to close."
            exit 0
          fi
          gh api -X PATCH "repos/${{ github.repository }}/milestones/$NUM" -f state=closed
          echo "Closed milestone $TITLE (#$NUM)."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  Cleanup:
    name: Prune old manual releases
    needs: [MSYS2, Ubuntu, MACOSX, MACOSX_INTEL]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Delete manual releases older than 30 days
        run: |
          CUTOFF=$(date -d '30 days ago' --utc +%Y-%m-%dT%H:%M:%SZ)
          gh release list --repo ${{ github.repository }} --limit 100 --json tagName,createdAt \
            | jq -r --arg cutoff "$CUTOFF" \
                '.[] | select(.tagName | startswith("manual-")) | select(.createdAt < $cutoff) | .tagName' \
            | while read TAG; do
                echo "Deleting release and tag: $TAG"
                gh release delete "$TAG" --yes --cleanup-tag
              done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
