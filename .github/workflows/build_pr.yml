name: Build PR's

on:
  pull_request: {}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relevant:
              - 'src/**'
              - 'tests/**'
              - 'resources/tools/seedgen/**'
              - 'resources/bin/**'
              - 'resources/dll/**'
              - 'resources/game.ini'
              - 'resources/game.ini.org'
              - 'CMakeLists.txt'
              - 'create_release.bat'
              - 'create_release.sh'
              - 'install_dependencies_macosx.sh'
              - 'install_dependencies_ubuntu.sh'
              - 'rebuildmacos.sh'
              - 'rebuildwin.bat'
              - 'rebuildwinrelease.bat'
              - '.github/workflows/**'

  MSYS2:
    name: Windows-msys2-mingw64
    needs: [changes]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: [windows-latest]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Install MSYS2 with MinGW 64-bit
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64 # D2TM is built within a MinGW64 bit environment
          update: true
          install: mingw-w64-x86_64-toolchain mingw-w64-x86_64-gcc mingw-w64-x86_64-sdl3 mingw-w64-x86_64-sdl3-mixer mingw-w64-x86_64-sdl3-image mingw-w64-x86_64-sdl3-ttf mingw64/mingw-w64-x86_64-cmake mingw-w64-x86_64-catch
      - name: configure Pagefile
        uses: al-cheb/configure-pagefile-action@v1.5
        with:
          minimum-size: 16GB
          maximum-size: 16GB
          disk-root: "C:"
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Configure
        run: |
          cd "${{ github.workspace }}"
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=RelWithDebInfo -G "MinGW Makefiles"
      - name: Build
        run: |
          cd "${{ github.workspace }}\build"
          cmake --build . -j2
      - name: Test
        run: |
          cd "${{ github.workspace }}\build"
          ctest --output-on-failure
  Ubuntu:
    name: Ubuntu (x64)
    needs: [changes]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: [ ubuntu-latest ]
    steps:
      - name: Set up GCC
        uses: egor-tensin/setup-gcc@v1
        with:
          version: 14
          platform: x64
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          cd "${{ github.workspace }}"
          chmod +x install_dependencies_ubuntu.sh
          ./install_dependencies_ubuntu.sh
      - name: Configure
        run: |
          cd "${{ github.workspace }}"
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: |
          cd "${{ github.workspace }}/build"
          make -j4
      - name: Test
        run: |
          cd "${{ github.workspace }}/build"
          ctest --output-on-failure
  COVERAGE:
    name: Unit test coverage (Ubuntu)
    needs: [changes]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: [ ubuntu-latest ]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          chmod +x install_dependencies_ubuntu.sh
          ./install_dependencies_ubuntu.sh
          sudo apt-get install -y lcov
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DD2TM_COVERAGE=ON
      - name: Build tests
        run: cmake --build build --target d2tm_tests seedgen_tests seedgen_tests_large -j4
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Collect coverage
        run: |
          lcov --capture --directory build --output-file coverage.info --ignore-errors mismatch,gcov,source
          lcov --extract coverage.info "$GITHUB_WORKSPACE/src/*" --output-file coverage-src.info --ignore-errors unused
          genhtml coverage-src.info --output-directory coverage-html --ignore-errors source
          lcov --summary coverage-src.info 2>&1 | grep -E "lines|functions" | sed 's/^ *//' > coverage-summary.txt
          cat coverage-summary.txt
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage-html
      - name: Post summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Unit test coverage (src/)"
            echo '```'
            cat coverage-summary.txt
            echo '```'
            echo 'Full HTML report: artifact `coverage-html` of this workflow run.'
          } > coverage-comment.md
          cat coverage-comment.md >> "$GITHUB_STEP_SUMMARY"
          # fork PRs have a read-only token, so the comment is best effort
          gh pr comment "${{ github.event.pull_request.number }}" --edit-last --create-if-none --body-file coverage-comment.md             || echo "Could not post PR comment (fork PR?)"
  MACOSX:
    name: Mac OS X (Arm64)
    needs: [changes]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: [ macos-15 ]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          ./install_dependencies_macosx.sh
      - name: Configure
        run: |
          cd "${{ github.workspace }}"
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: |
          cd "${{ github.workspace }}/build"
          make -j4
      - name: Test
        run: |
          cd "${{ github.workspace }}/build"
          ctest --output-on-failure
  MACOSX_INTEL:
    name: Mac OS X (Intel)
    needs: [changes]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: [ macos-15-intel ]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          ./install_dependencies_macosx.sh
      - name: Configure
        run: |
          cd "${{ github.workspace }}"
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: |
          cd "${{ github.workspace }}/build"
          make -j4
      - name: Test
        run: |
          cd "${{ github.workspace }}/build"
          ctest --output-on-failure